{% if profile.email or profile.linkedin_url %}
<section class="band band--field closer" aria-labelledby="closer-heading">
  <div class="container closer-inner">
    <h2 id="closer-heading" class="display display--md">Let’s talk.</h2>
    <div class="actions">
      {% if profile.email %}<a class="button button--strap" href="mailto:{{ profile.email|lower }}">{{ profile.email|lower }}</a>{% endif %}
      {% if profile.linkedin_url %}<a class="button button--ghost" href="{{ profile.linkedin_url }}" rel="noopener">LinkedIn</a>{% endif %}
    </div>
  </div>
</section>
{% endif %}
